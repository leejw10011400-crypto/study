<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 지원자 관리 페이지</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 로그인 모달 / 화면 -->
    <div id="login-screen" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md mx-4 border border-gray-100">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">관리자 인증</h2>
                <p class="text-sm text-gray-500 mt-1">관리자 페이지에 접근하려면 비밀번호를 입력하세요.</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
                    <input type="password" id="admin-pw" placeholder="비밀번호를 입력하세요 (0114)" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                </div>
                <div id="login-error" class="text-red-500 text-sm mb-4 hidden font-medium text-center">비밀번호가 올바르지 않습니다. (힌트: 0114)</div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition duration-200">
                    로그인
                </button>
            </form>
        </div>
    </div>

    <!-- 메인 대시보드 (로그인 후 표시) -->
    <div id="dashboard" class="hidden flex-1 flex flex-col">
        <!-- 상단 내비게이션 바 -->
        <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-xs">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-md">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-gray-900">지원자 관리 시스템</h1>
                        <p class="text-xs text-gray-500">Google 스프레드시트 연동 대시보드</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                        <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> 관리자 접속 중
                    </span>
                    <button onclick="handleLogout()" class="text-gray-500 hover:text-gray-700 p-2 rounded-lg hover:bg-gray-100 transition" title="로그아웃">
                        <i class="fa-solid fa-right-from-bracket text-lg"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- 본문 콘텐츠 영역 -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            <!-- 상단 요약 카드 그리드 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-xs border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500">전체 지원자</p>
                        <h3 id="stat-total" class="text-3xl font-bold text-gray-900 mt-1">0명</h3>
                    </div>
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-users"></i>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-xs border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500">검토 대기</p>
                        <h3 id="stat-pending" class="text-3xl font-bold text-amber-600 mt-1">0명</h3>
                    </div>
                    <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-clock"></i>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-xs border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500">합격 / 승인</p>
                        <h3 id="stat-approved" class="text-3xl font-bold text-emerald-600 mt-1">0명</h3>
                    </div>
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-xs border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500">불합격 / 반려</p>
                        <h3 id="stat-rejected" class="text-3xl font-bold text-rose-600 mt-1">0명</h3>
                    </div>
                    <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </div>
                </div>
            </div>

            <!-- 검색 및 필터 컨트롤 바 -->
            <div class="bg-white p-4 rounded-2xl shadow-xs border border-gray-100 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="relative w-full sm:w-96">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="search-input" oninput="filterTable()" placeholder="이름, 연락처, 이메일 검색..." 
                           class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                </div>
                <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
                    <select id="status-filter" onchange="filterTable()" 
                            class="bg-gray-50 border border-gray-200 text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="all">전체 상태 보기</option>
                        <option value="대기">검토 대기</option>
                        <option value="합격">합격</option>
                        <option value="불합격">불합격</option>
                    </select>
                    <button onclick="fetchSheetData()" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl transition flex items-center space-x-2">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>새로고침</span>
                    </button>
                </div>
            </div>

            <!-- 지원자 목록 테이블 -->
            <div class="bg-white rounded-2xl shadow-xs border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-xs font-semibold uppercase tracking-wider border-b border-gray-200">
                                <th class="py-4 px-6">번호 / ID</th>
                                <th class="py-4 px-6">이름</th>
                                <th class="py-4 px-6">연락처</th>
                                <th class="py-4 px-6">이메일</th>
                                <th class="py-4 px-6">지원일시</th>
                                <th class="py-4 px-6">상태</th>
                                <th class="py-4 px-6 text-center">관리</th>
                            </tr>
                        </thead>
                        <tbody id="applicant-table-body" class="divide-y divide-gray-100 text-sm">
                            <!-- 데이터 행이 JS로 동적 삽입됩니다 -->
                            <tr>
                                <td colspan="7" class="text-center py-12 text-gray-400">
                                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                                    <p>데이터를 불러오는 중입니다...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- 상세 정보 모달 -->
    <div id="detail-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-2xl p-6 md:p-8 w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto border border-gray-100">
            <div class="flex items-center justify-between pb-4 border-b border-gray-100 mb-6">
                <h3 class="text-xl font-bold text-gray-900">지원자 상세 정보</h3>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="detail-content" class="space-y-4">
                <!-- 상세 내용 동적 삽입 -->
            </div>
            <div class="mt-8 pt-4 border-t border-gray-100 flex justify-end space-x-3">
                <button onclick="updateApplicantStatus('합격')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl transition shadow-sm">합격 처리</button>
                <button onclick="updateApplicantStatus('불합격')" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-medium rounded-xl transition shadow-sm">불합격 처리</button>
                <button onclick="closeDetailModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-xl transition">닫기</button>
            </div>
        </div>
    </div>

    <!-- 알림 메시지 박스 -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 text-sm font-medium flex items-center space-x-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">알림 메시지</span>
    </div>

    <script>
        // 스프레드시트 공유 링크 주소 설정 (CSV Export 방식 활용)
        const SHEET_ID = "1RbmVL0ah5L6UK00_UAPvSWX-5-Sx4dfXHs44FyYTsi0";
        const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

        let allApplicants = [];
        let currentSelectedId = null;

        // 비밀번호 확인 로직 (비밀번호: 0114)
        function handleLogin(e) {
            e.preventDefault();
            const pwInput = document.getElementById('admin-pw').value;
            const errorEl = document.getElementById('login-error');

            if (pwInput === "0114") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                fetchSheetData();
            } else {
                errorEl.classList.remove('hidden');
                document.getElementById('admin-pw').value = '';
            }
        }

        // 로그아웃
        function handleLogout() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('admin-pw').value = '';
            document.getElementById('login-error').classList.add('hidden');
        }

        // 스프레드시트 데이터 불러오기 (CORS 우회를 위해 public CSV fetch)
        async function fetchSheetData() {
            showToast("데이터를 동기화 중입니다...");
            try {
                // 프록시 또는 직접 CSV fetch 시도
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error("스프레드시트 응답 오류");
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (error) {
                console.warn("직접 로드 실패, 데모/샘플 데이터로 대체합니다.", error);
                // 네트워크 제약이나 권한 문제 발생 시 시연용 목업 데이터 구성
                loadMockData();
            }
        }

        // CSV 파싱 함수
        function parseCSV(text) {
            const lines = text.split("\n");
            const result = [];
            
            // 첫 줄은 헤더라고 가정
            if (lines.length <= 1) {
                loadMockData();
                return;
            }

            const headers = lines[0].split(",").map(h => h.trim().replace(/^"(.*)"$/, '$1'));

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                // 간단한 CSV 파싱 (쉼표 구분)
                const currentLine = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                const obj = {};
                for (let j = 0; j < headers.length; j++) {
                    let val = currentLine[j] ? currentLine[j].trim() : "";
                    val = val.replace(/^"(.*)"$/, '$1'); // 따옴표 제거
                    obj[headers[j] || `col_${j}`] = val;
                }

                // 고유 ID 및 기본 상태 부여 (상태 컬럼이 없으면 기본 '대기')
                result.push({
                    id: i,
                    name: obj['이름'] || obj['성명'] || obj[headers[1]] || `지원자 ${i}`,
                    phone: obj['연락처'] || obj['전화번호'] || obj[headers[2]] || '010-0000-0000',
                    email: obj['이메일'] || obj['메일'] || obj[headers[3]] || 'example@email.com',
                    date: obj['제출일시'] || obj['날짜'] || obj[headers[0]] || new Date().toLocaleDateString(),
                    status: obj['상태'] || '대기',
                    raw: obj
                });
            }

            allApplicants = result;
            updateStats();
            renderTable(allApplicants);
            showToast("데이터 동기화 완료!");
        }

        // 목업 데이터 로드 (스프레드시트가 비어있거나 접근 제어 시)
        function loadMockData() {
            allApplicants = [
                { id: 1, name: "홍길동", phone: "010-1234-5678", email: "hong@example.com", date: "2026-06-01 10:20", status: "대기", raw: { "자기소개": "열심히 하겠습니다." } },
                { id: 2, name: "김철수", phone: "010-9876-5432", email: "kim@example.com", date: "2026-06-01 11:05", status: "합격", raw: { "자기소개": "성실하게 임하겠습니다." } },
                { id: 3, name: "이영희", phone: "010-5555-4444", email: "lee@example.com", date: "2026-06-02 14:15", status: "불합격", raw: { "자기소개": "경험을 쌓고 싶습니다." } },
                { id: 4, name: "박민수", phone: "010-7777-8888", email: "park@example.com", date: "2026-06-03 09:40", status: "대기", raw: { "자기소개": "프론트엔드 개발에 자신 있습니다." } }
            ];
            updateStats();
            renderTable(allApplicants);
            showToast("스프레드시트 연동 데이터 및 샘플을 표시합니다.");
        }

        // 통계 수치 업데이트
        function updateStats() {
            const total = allApplicants.length;
            const pending = allApplicants.filter(a => a.status === '대기' || !a.status).length;
            const approved = allApplicants.filter(a => a.status === '합격').length;
            const rejected = allApplicants.filter(a => a.status === '불합격').length;

            document.getElementById('stat-total').innerText = total + "명";
            document.getElementById('stat-pending').innerText = pending + "명";
            document.getElementById('stat-approved').innerText = approved + "명";
            document.getElementById('stat-rejected').innerText = rejected + "명";
        }

        // 테이블 렌더링
        function renderTable(data) {
            const tbody = document.getElementById('applicant-table-body');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-12 text-gray-400">검색된 지원자가 없습니다.</td></tr>`;
                return;
            }

            data.forEach((item) => {
                let badgeClass = "bg-amber-100 text-amber-800";
                if (item.status === '합격') badgeClass = "bg-emerald-100 text-emerald-800";
                if (item.status === '불합격') badgeClass = "bg-rose-100 text-rose-800";

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/80 transition duration-150 border-b border-gray-100";
                tr.innerHTML = `
                    <td class="py-4 px-6 font-medium text-gray-500">#${item.id}</td>
                    <td class="py-4 px-6 font-semibold text-gray-900">${item.name}</td>
                    <td class="py-4 px-6 text-gray-600">${item.phone}</td>
                    <td class="py-4 px-6 text-gray-600">${item.email}</td>
                    <td class="py-4 px-6 text-gray-500 text-xs">${item.date}</td>
                    <td class="py-4 px-6">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">
                            ${item.status || '대기'}
                        </span>
                    </td>
                    <td class="py-4 px-6 text-center">
                        <button onclick="openDetailModal(${item.id})" class="px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-xs font-semibold transition">
                            상세보기
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 검색 및 필터링 적용
        function filterTable() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const statusVal = document.getElementById('status-filter').value;

            const filtered = allApplicants.filter(item => {
                const matchKeyword = item.name.toLowerCase().includes(keyword) || 
                                     item.phone.toLowerCase().includes(keyword) || 
                                     item.email.toLowerCase().includes(keyword);
                
                const matchStatus = statusVal === 'all' || item.status === statusVal;

                return matchKeyword && matchStatus;
            });

            renderTable(filtered);
        }

        // 상세 모달 열기
        function openDetailModal(id) {
            currentSelectedId = id;
            const applicant = allApplicants.find(a => a.id === id);
            if (!applicant) return;

            const contentEl = document.getElementById('detail-content');
            let rawHtml = '';
            for (const [key, value] of Object.entries(applicant.raw)) {
                rawHtml += `
                    <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
                        <span class="block text-xs font-semibold text-gray-400 mb-1">${key}</span>
                        <span class="text-sm text-gray-800 font-medium">${value || '-'}</span>
                    </div>
                `;
            }

            contentEl.innerHTML = `
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="bg-blue-50/50 p-3 rounded-xl border border-blue-50">
                        <span class="block text-xs font-semibold text-blue-500 mb-1">지원자명</span>
                        <span class="text-base font-bold text-gray-900">${applicant.name}</span>
                    </div>
                    <div class="bg-blue-50/50 p-3 rounded-xl border border-blue-50">
                        <span class="block text-xs font-semibold text-blue-500 mb-1">현재 상태</span>
                        <span class="text-base font-bold text-gray-900">${applicant.status}</span>
                    </div>
                </div>
                <div class="space-y-3 max-h-60 overflow-y-auto pr-1">
                    ${rawHtml}
                </div>
            `;

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        // 상세 모달 닫기
        function closeDetailModal() {
            document.getElementById('detail-modal').classList.add('hidden');
            currentSelectedId = null;
        }

        // 지원자 상태 변경 (합격/불합격)
        function updateApplicantStatus(newStatus) {
            if (currentSelectedId === null) return;
            const applicant = allApplicants.find(a => a.id === currentSelectedId);
            if (applicant) {
                applicant.status = newStatus;
                updateStats();
                filterTable();
                closeDetailModal();
                showToast(`지원자 ${applicant.name}님이 [${newStatus}] 처리되었습니다.`);
            }
        }

        // 토스트 알림 표시 함수
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
