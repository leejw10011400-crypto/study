<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 공부 기록장</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      background-color: #f3f4f6;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1; 
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8; 
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen py-6 px-4 sm:px-6 lg:px-8">

  <div class="max-w-2xl mx-auto">
    <!-- 헤더 섹션 -->
    <div class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-t-2xl p-6 sm:p-8 text-white shadow-lg">
      <div class="flex items-center justify-between">
        <div>
          <span class="inline-block px-3 py-1 bg-white/25 backdrop-blur-sm rounded-full text-xs font-medium tracking-wider mb-2">
            STUDY TRACKER
          </span>
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">오늘의 공부 기록</h1>
          <p class="text-indigo-100 text-sm mt-1">24시간 그리드에서 여러 타임의 공부 구간을 자유롭게 선택하세요.</p>
        </div>
        <div class="hidden sm:flex h-14 w-14 bg-white/10 rounded-2xl items-center justify-center text-2xl">
          <i class="fa-solid fa-book-open-reader"></i>
        </div>
      </div>
    </div>

    <!-- 메인 폼 컨테이너 -->
    <div class="bg-white rounded-b-2xl shadow-lg p-6 sm:p-8 border-x border-b border-slate-100">
      
      <!-- 알림 메시지 박스 -->
      <div id="messageBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium flex items-center justify-between transition-all duration-300">
        <div class="flex items-center gap-3">
          <i id="messageIcon" class="fa-solid text-lg"></i>
          <span id="messageText"></span>
        </div>
        <button type="button" onclick="hideMessage()" class="text-current opacity-70 hover:opacity-100">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="studyForm" class="space-y-6">
        
        <!-- 1. 날짜 & 오늘 공부량 요약 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="studyDate" class="block text-sm font-semibold text-slate-700 mb-1.5">
              <i class="fa-regular fa-calendar text-indigo-500 mr-1.5"></i>날짜
            </label>
            <input type="date" id="studyDate" required
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
          </div>

          <div>
            <label for="studyDuration" class="block text-sm font-semibold text-slate-700 mb-1.5">
              <i class="fa-solid fa-stopwatch text-indigo-500 mr-1.5"></i>오늘 총 공부량
              <span class="text-xs font-normal text-slate-400 ml-1">(시간대 선택 시 자동 합산)</span>
            </label>
            <input type="text" id="studyDuration" required readonly placeholder="시간대를 선택해주세요"
              class="w-full px-4 py-2.5 bg-indigo-50/60 border border-indigo-200 rounded-xl text-indigo-900 font-semibold focus:outline-none cursor-default">
          </div>
        </div>

        <!-- 2. 공부 시간 선택 (24행 시 x 6열 분 - 다중 구간 지원) -->
        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200/80">
          <div class="flex items-center justify-between mb-3">
            <label class="block text-sm font-semibold text-slate-700">
              <i class="fa-solid fa-table-cells text-indigo-500 mr-1.5"></i>공부 시간대 선택 (여러 타임 선택 가능)
            </label>
            <button type="button" onclick="clearTimeGrid()" class="text-xs text-slate-500 hover:text-rose-600 px-2.5 py-1 bg-white border border-slate-200 rounded-lg transition">
              <i class="fa-solid fa-rotate-left mr-1"></i>전체 초기화
            </button>
          </div>
          
          <p class="text-xs text-slate-500 mb-3 flex items-center gap-1">
            <i class="fa-solid fa-circle-info text-indigo-400"></i>
            <span>시작할 10분 칸을 누르고, 끝날 10분 칸을 누르면 구간이 추가됩니다. (선택된 칸을 누르면 개별 취소 가능)</span>
          </p>

          <div class="bg-white border border-slate-200 rounded-xl p-3 overflow-y-auto max-h-72 shadow-inner">
            <div id="timeGrid" class="grid grid-cols-7 gap-1 text-center text-xs">
              <div class="font-bold text-slate-400 py-1 sticky top-0 bg-white z-10">시</div>
              <div class="font-bold text-slate-600 py-1 sticky top-0 bg-white z-10">00분</div>
              <div class="font-bold text-slate-600 py-1 sticky top-0 bg-white z-10">10분</div>
              <div class="font-bold text-slate-600 py-1 sticky top-0 bg-white z-10">20분</div>
              <div class="font-bold text-slate-600 py-1 sticky top-0 bg-white z-10">30분</div>
              <div class="font-bold text-slate-600 py-1 sticky top-0 bg-white z-10">40분</div>
              <div class="font-bold text-slate-600 py-1 sticky top-0 bg-white z-10">50분</div>
            </div>
          </div>
          
          <div id="selectedTimeRangeText" class="mt-3 text-xs font-medium text-indigo-700 bg-indigo-50/80 px-3.5 py-2.5 rounded-lg space-y-1">
            <div>선택된 시간대 구간: <span class="font-bold text-indigo-900">없음</span></div>
          </div>
        </div>

        <!-- 3. 오늘 뭘 공부했는지 (동적 입력 칸 추가 가능) -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-sm font-semibold text-slate-700">
              <i class="fa-solid fa-pen-to-square text-indigo-500 mr-1.5"></i>오늘 뭘 공부했나요?
            </label>
            <button type="button" onclick="addStudyInput()"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-xs font-semibold rounded-lg transition cursor-pointer">
              <i class="fa-solid fa-plus"></i> 항목 추가
            </button>
          </div>
          
          <div id="studiedContainer" class="space-y-2.5">
            <div class="flex items-center gap-2 study-item-row">
              <span class="flex-shrink-0 w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 text-xs font-bold flex items-center justify-center item-number">1</span>
              <input type="text" name="studiedItem[]" required placeholder="공부한 과목이나 내용을 입력하세요 (예: 수학 미적분 2단원 문제풀이)"
                class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
              <button type="button" onclick="removeStudyInput(this)" title="삭제"
                class="flex-shrink-0 p-2.5 text-slate-400 rounded-xl transition opacity-50 cursor-not-allowed" disabled>
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- 4. 내일 뭘 공부할지 -->
        <div>
          <label for="tomorrowPlan" class="block text-sm font-semibold text-slate-700 mb-1.5">
            <i class="fa-solid fa-rocket text-indigo-500 mr-1.5"></i>내일 뭘 공부할까요?
          </label>
          <textarea id="tomorrowPlan" rows="3" required placeholder="내일 집중해서 공부할 목표나 계획을 적어보세요..."
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition resize-none"></textarea>
        </div>

        <!-- 저장 버튼 -->
        <div class="pt-2">
          <button type="submit" id="submitBtn"
            class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span id="submitBtnText">스프레드시트에 기록 저장하기</span>
          </button>
        </div>

      </form>
    </div>

    <!-- 최근 기록 미리보기 섹션 -->
    <div class="mt-8 bg-white rounded-2xl shadow-md p-6 border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left text-indigo-500"></i>
          최근 저장된 공부 기록
        </h2>
        <button type="button" onclick="loadRecentLogs()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1">
          <i class="fa-solid fa-rotate-right"></i> 새로고침
        </button>
      </div>
      
      <div id="recentLogsContainer" class="space-y-3">
        <p class="text-sm text-slate-400 text-center py-4">기록을 불러오는 중입니다...</p>
      </div>
    </div>

  </div>

  <script>
    let selectedSlots = new Set();
    let firstSelectedSlot = null;

    document.addEventListener('DOMContentLoaded', () => {
      initDate();
      initTimeGrid();
      loadRecentLogs();
    });

    function initDate() {
      const today = new Date();
      const offset = today.getTimezoneOffset() * 60000;
      const localISOTime = (new Date(today - offset)).toISOString().slice(0, 10);
      document.getElementById('studyDate').value = localISOTime;
    }

    function initTimeGrid() {
      const grid = document.getElementById('timeGrid');
      
      for (let h = 0; h < 24; h++) {
        const hourLabel = document.createElement('div');
        hourLabel.className = 'flex items-center justify-center font-semibold text-slate-500 bg-slate-50 rounded-lg py-1 text-xs';
        hourLabel.textContent = `${String(h).padStart(2, '0')}시`;
        grid.appendChild(hourLabel);

        for (let m = 0; m < 60; m += 10) {
          const slotIndex = h * 6 + (m / 10);
          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'time-slot h-8 rounded-lg border border-slate-200 bg-white text-slate-600 hover:border-indigo-400 hover:bg-indigo-50/50 transition flex items-center justify-center text-[10px] font-medium cursor-pointer select-none';
          cell.dataset.slotIndex = slotIndex;
          cell.textContent = `${String(m).padStart(2, '0')}`;
          
          cell.addEventListener('click', () => handleSlotClick(slotIndex));
          grid.appendChild(cell);
        }
      }
    }

    function handleSlotClick(slotIndex) {
      if (firstSelectedSlot === null) {
        // 이미 선택되어 있는 슬롯을 클릭한 경우 토글(개별 해제) 처리 허용
        if (selectedSlots.has(slotIndex)) {
          selectedSlots.delete(slotIndex);
        } else {
          firstSelectedSlot = slotIndex;
        }
      } else {
        const start = Math.min(firstSelectedSlot, slotIndex);
        const end = Math.max(firstSelectedSlot, slotIndex);
        
        for (let i = start; i <= end; i++) {
          selectedSlots.add(i);
        }
        firstSelectedSlot = null;
      }
      
      updateGridUI();
      updateDurationAndSummary();
    }

    function updateGridUI() {
      const cells = document.querySelectorAll('.time-slot');
      cells.forEach(cell => {
        const idx = parseInt(cell.dataset.slotIndex, 10);
        if (selectedSlots.has(idx)) {
          cell.className = 'time-slot h-8 rounded-lg border border-indigo-600 bg-indigo-600 text-white shadow-sm transition flex items-center justify-center text-[10px] font-bold cursor-pointer select-none';
        } else if (firstSelectedSlot === idx) {
          cell.className = 'time-slot h-8 rounded-lg border-2 border-indigo-500 bg-indigo-100 text-indigo-800 transition flex items-center justify-center text-[10px] font-bold cursor-pointer select-none animate-pulse';
        } else {
          cell.className = 'time-slot h-8 rounded-lg border border-slate-200 bg-white text-slate-600 hover:border-indigo-400 hover:bg-indigo-50/50 transition flex items-center justify-center text-[10px] font-medium cursor-pointer select-none';
        }
      });
    }

    function getGroupedRanges() {
      if (selectedSlots.size === 0) return [];

      const sorted = Array.from(selectedSlots).sort((a, b) => a - b);
      const ranges = [];
      let rangeStart = sorted[0];
      let prev = sorted[0];

      for (let i = 1; i < sorted.length; i++) {
        if (sorted[i] === prev + 1) {
          prev = sorted[i];
        } else {
          ranges.push({ start: rangeStart, end: prev });
          rangeStart = sorted[i];
          prev = sorted[i];
        }
      }
      ranges.push({ start: rangeStart, end: prev });
      return ranges;
    }

    function updateDurationAndSummary() {
      const durationInput = document.getElementById('studyDuration');
      const rangeContainer = document.getElementById('selectedTimeRangeText');

      if (selectedSlots.size === 0) {
        durationInput.value = '';
        rangeContainer.innerHTML = '선택된 시간대 구간: <span class="font-bold text-indigo-900">없음</span>';
        return;
      }

      const ranges = getGroupedRanges();
      let rangeHtmls = ranges.map((r, idx) => {
        const startH = Math.floor(r.start / 6);
        const startM = (r.start % 6) * 10;
        
        let endTotalMins = (Math.floor(r.end / 6) * 60) + ((r.end % 6) * 10) + 10;
        let endH = Math.floor(endTotalMins / 60) % 24;
        let endM = endTotalMins % 60;
        
        const sStr = `${String(startH).padStart(2, '0')}:${String(startM).padStart(2, '0')}`;
        const eStr = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
        return `<span class="inline-block bg-white border border-indigo-200 px-2 py-0.5 rounded mr-1 mb-1 font-semibold text-indigo-900">${idx + 1}타임: ${sStr} ~ ${eStr}</span>`;
      });

      if (firstSelectedSlot !== null) {
        const h = Math.floor(firstSelectedSlot / 6);
        const m = (firstSelectedSlot % 6) * 10;
        const tempStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        rangeHtmls.push(`<span class="text-indigo-600 italic">(${tempStr} 시작점 지정됨 - 종료할 칸을 누르세요)</span>`);
      }

      rangeContainer.innerHTML = `<div class="mb-1">선택된 시간대 (${ranges.length}개 구간):</div><div>${rangeHtmls.join(' ')}</div>`;

      const totalMins = selectedSlots.size * 10;
      const hours = Math.floor(totalMins / 60);
      const mins = totalMins % 60;

      let durationStr = '';
      if (hours > 0 && mins > 0) {
        durationStr = `${hours}시간 ${mins}분`;
      } else if (hours > 0) {
        durationStr = `${hours}시간`;
      } else {
        durationStr = `${mins}분`;
      }

      durationInput.value = durationStr;
    }

    function clearTimeGrid() {
      selectedSlots.clear();
      firstSelectedSlot = null;
      updateGridUI();
      updateDurationAndSummary();
    }

    function addStudyInput() {
      const container = document.getElementById('studiedContainer');
      const rowCount = container.querySelectorAll('.study-item-row').length;
      
      const newRow = document.createElement('div');
      newRow.className = 'flex items-center gap-2 study-item-row animate-fadeIn';
      newRow.innerHTML = `
        <span class="flex-shrink-0 w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 text-xs font-bold flex items-center justify-center item-number">${rowCount + 1}</span>
        <input type="text" name="studiedItem[]" required placeholder="추가로 공부한 내용을 입력하세요"
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
        <button type="button" onclick="removeStudyInput(this)" title="삭제"
          class="flex-shrink-0 p-2.5 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition cursor-pointer">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      `;
      
      container.appendChild(newRow);
      updateRowNumbers();
      newRow.querySelector('input').focus();
    }

    function removeStudyInput(btn) {
      const container = document.getElementById('studiedContainer');
      const rows = container.querySelectorAll('.study-item-row');
      
      if (rows.length > 1) {
        btn.closest('.study-item-row').remove();
        updateRowNumbers();
      }
    }

    function updateRowNumbers() {
      const container = document.getElementById('studiedContainer');
      const rows = container.querySelectorAll('.study-item-row');
      
      rows.forEach((row, index) => {
        row.querySelector('.item-number').textContent = index + 1;
        const delBtn = row.querySelector('button');
        if (rows.length === 1) {
          delBtn.disabled = true;
          delBtn.classList.add('opacity-50', 'cursor-not-allowed');
          delBtn.classList.remove('hover:text-rose-500', 'hover:bg-rose-50', 'cursor-pointer');
        } else {
          delBtn.disabled = false;
          delBtn.classList.remove('opacity-50', 'cursor-not-allowed');
          delBtn.classList.add('hover:text-rose-500', 'hover:bg-rose-50', 'cursor-pointer');
        }
      });
    }

    function showMessage(text, isSuccess = true) {
      const box = document.getElementById('messageBox');
      const icon = document.getElementById('messageIcon');
      const msgText = document.getElementById('messageText');

      box.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-rose-50', 'text-rose-800', 'border-rose-200');
      icon.classList.remove('fa-circle-check', 'text-emerald-500', 'fa-circle-exclamation', 'text-rose-500');

      if (isSuccess) {
        box.classList.add('bg-emerald-50', 'text-emerald-800', 'border', 'border-emerald-200');
        icon.classList.add('fa-circle-check', 'text-emerald-500');
      } else {
        box.classList.add('bg-rose-50', 'text-rose-800', 'border', 'border-rose-200');
        icon.classList.add('fa-circle-exclamation', 'text-rose-500');
      }

      msgText.textContent = text;
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideMessage() {
      document.getElementById('messageBox').classList.add('hidden');
    }

    document.getElementById('studyForm').addEventListener('submit', function(e) {
      e.preventDefault();
      hideMessage();

      if (selectedSlots.size === 0) {
        showMessage('공부한 시간대 그리드를 최소 1개 이상 선택해주세요.', false);
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const submitBtnText = document.getElementById('submitBtnText');
      
      const date = document.getElementById('studyDate').value;
      const durationText = document.getElementById('studyDuration').value.trim();
      const tomorrowPlan = document.getElementById('tomorrowPlan').value.trim();
      
      const ranges = getGroupedRanges();
      const timeRanges = ranges.map(r => {
        const startH = Math.floor(r.start / 6);
        const startM = (r.start % 6) * 10;
        let endTotalMins = (Math.floor(r.end / 6) * 60) + ((r.end % 6) * 10) + 10;
        let endH = Math.floor(endTotalMins / 60) % 24;
        let endM = endTotalMins % 60;
        
        return {
          start: `${String(startH).padStart(2, '0')}:${String(startM).padStart(2, '0')}`,
          end: `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`
        };
      });

      const itemInputs = document.querySelectorAll('input[name="studiedItem[]"]');
      const studiedItems = Array.from(itemInputs).map(input => input.value.trim()).filter(val => val !== '');

      if (studiedItems.length === 0) {
        showMessage('오늘 공부한 내용을 최소 1개 이상 입력해주세요.', false);
        return;
      }

      const payload = {
        date: date,
        timeRanges: timeRanges,
        durationText: durationText,
        studiedItems: studiedItems,
        tomorrowPlan: tomorrowPlan
      };

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
      submitBtnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>저장하는 중...';

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(response) {
            resetSubmitButton();
            if (response.success) {
              showMessage(response.message, true);
              resetFormFields();
              loadRecentLogs();
            } else {
              showMessage(response.message, false);
            }
          })
          .withFailureHandler(function(error) {
            resetSubmitButton();
            showMessage('서버 통신 오류: ' + error.message, false);
          })
          .saveStudyLog(payload);
      } else {
        setTimeout(() => {
          resetSubmitButton();
          showMessage('테스트 환경입니다. Google Apps Script 배포 환경에서 시트에 저장됩니다.', true);
          console.log('전송 데이터:', payload);
        }, 800);
      }
    });

    function resetSubmitButton() {
      const submitBtn = document.getElementById('submitBtn');
      const submitBtnText = document.getElementById('submitBtnText');
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
      submitBtnText.textContent = '스프레드시트에 기록 저장하기';
    }

    function resetFormFields() {
      clearTimeGrid();
      const container = document.getElementById('studiedContainer');
      container.innerHTML = `
        <div class="flex items-center gap-2 study-item-row">
          <span class="flex-shrink-0 w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 text-xs font-bold flex items-center justify-center item-number">1</span>
          <input type="text" name="studiedItem[]" required placeholder="공부한 과목이나 내용을 입력하세요 (예: 수학 미적분 2단원 문제풀이)"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
          <button type="button" onclick="removeStudyInput(this)" title="삭제"
            class="flex-shrink-0 p-2.5 text-slate-400 rounded-xl transition opacity-50 cursor-not-allowed" disabled>
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      `;
      document.getElementById('tomorrowPlan').value = '';
    }

    function loadRecentLogs() {
      const container = document.getElementById('recentLogsContainer');
      container.innerHTML = '<p class="text-sm text-slate-400 text-center py-4"><i class="fa-solid fa-spinner fa-spin mr-1"></i> 불러오는 중...</p>';

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(logs) {
            if (!logs || logs.length === 0) {
              container.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">아직 저장된 기록이 없습니다.</p>';
              return;
            }

            container.innerHTML = logs.map(log => `
              <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-200/70 text-sm">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-1.5">
                  <span class="font-bold text-slate-700">${escapeHtml(log.date)}</span>
                  <div class="flex items-center gap-2 text-xs">
                    <span class="px-2 py-0.5 bg-indigo-100 text-indigo-700 font-semibold rounded-md">
                      총 ${escapeHtml(log.duration)}
                    </span>
                  </div>
                </div>
                <div class="text-xs text-slate-500 bg-white p-2 rounded-lg border border-slate-200/60 mb-2 whitespace-pre-line">
                  <span class="font-semibold text-slate-700">공부 시간대:</span><br>${escapeHtml(log.timeRanges)}
                </div>
                <div class="text-slate-600 whitespace-pre-line text-xs leading-relaxed pl-2 border-l-2 border-indigo-300">
                  ${escapeHtml(log.studied)}
                </div>
                ${log.tomorrow ? `
                  <div class="mt-2 pt-2 border-t border-slate-200/60 text-xs text-slate-500 flex items-start gap-1.5">
                    <span class="font-semibold text-violet-600 shrink-0">내일 계획:</span>
                    <span>${escapeHtml(log.tomorrow)}</span>
                  </div>
                ` : ''}
              </div>
            `).join('');
          })
          .withFailureHandler(function() {
            container.innerHTML = '<p class="text-sm text-rose-400 text-center py-4">기록을 불러오지 못했습니다.</p>';
          })
          .getRecentLogs();
      } else {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-3">Apps Script 배포 환경에서 최근 기록이 표시됩니다.</p>';
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
